version: '3.8'

services:
  backend:
    image: dheeraj7000/ontorag-backend:latest
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - OLLAMA_URL=http://host.docker.internal:11434
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 400m

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password}
      - NEO4J_server_memory_heap_initial__size=200M
      - NEO4J_server_memory_heap_max__size=300M
      # Pin page cache explicitly — without this Neo4j 5 auto-sizes it off
      # total physical memory and refuses to start on a 957MB t2.micro
      # ("Invalid memory configuration - exceeds physical memory").
      - NEO4J_server_memory_pagecache_size=64M
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Lightweight HTTP check instead of cypher-shell: cypher-shell spawns a
      # fresh JVM per invocation, which is too expensive to run every 10s on
      # a t2.micro (was pegging CPU at 1200%+ and starving the API/Ollama).
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 400m

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
